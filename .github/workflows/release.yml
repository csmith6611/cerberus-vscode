name: Release

# Push a tag matching package.json's version, e.g. `git tag v0.5.0 && git push origin v0.5.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Installs and runs third-party code (npm scripts, tests), so it gets a read-only token that isn't saved to .git/config.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="# $VERSION" '$0 == v {found=1; next} /^# / {found=0} found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::No '# $VERSION' section in CHANGELOG.md"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            cerberus-tokens-${{ env.VERSION }}.vsix
            notes.md
          if-no-files-found: error

  # Only job with write access; it runs no project code.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cerberus-tokens-*.vsix --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
