name: Release

# Push a tag matching package.json's version, e.g. `git tag v0.5.0 && git push origin v0.5.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="# $VERSION" '$0 == v {found=1; next} /^# / {found=0} found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::No '# $VERSION' section in CHANGELOG.md"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "cerberus-tokens-$VERSION.vsix" --title "$GITHUB_REF_NAME" --notes-file notes.md
