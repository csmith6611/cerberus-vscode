name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: CHANGELOG.md has a section for this version
        run: |
          version=$(node -p "require('./package.json').version")
          grep -qx "# $version" CHANGELOG.md || { echo "::error::Add a '# $version' section to CHANGELOG.md before tagging v$version"; exit 1; }
      - run: npm ci
      # Compiles, then runs the unit tests and the real Panda v1/v2 export tests.
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix
          path: '*.vsix'
