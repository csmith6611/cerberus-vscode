name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: CHANGELOG.md has a section for this version
        run: |
          version=$(node -p "require('./package.json').version")
          grep -qx "# $version" CHANGELOG.md || { echo "::error::Add a '# $version' section to CHANGELOG.md before tagging v$version"; exit 1; }
      - run: npm ci
      # Compiles, then runs the unit tests and the real Panda v1/v2 export tests.
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
